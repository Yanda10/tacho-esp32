<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor RPM Tachometer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.25rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 720px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 999px;
      background: #0f172a;
      border: 1px solid #334155;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }
    .dot.online {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }
    .btn-reset {
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-reset:hover {
      color: #f8fafc;
      border-color: #38bdf8;
    }
    .readout {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .rpm-value {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
    }
    .unit {
      font-size: 1rem;
      color: #94a3b8;
      letter-spacing: 3px;
      margin-top: 0.4rem;
      font-weight: 600;
    }
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .stats-bar strong {
      color: #f8fafc;
    }
    .chart-wrapper {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 1rem;
      height: 260px;
      position: relative;
    }
    .meta {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="status">
        <span id="dot" class="dot"></span>
        <span id="statusText">Menghubungkan...</span>
      </div>
      <button class="btn-reset" onclick="resetChart()">Reset Grafik</button>
    </div>

    <div class="readout">
      <div id="rpm" class="rpm-value">0</div>
      <div class="unit">RPM</div>
      <div class="stats-bar">
        <span>Puncak: <strong id="peakRpm">0</strong> RPM</span>
        <span>•</span>
        <span>Riwayat: <strong>60</strong> detik terakhir</span>
      </div>
    </div>

    <div class="chart-wrapper">
      <canvas id="rpmChart"></canvas>
    </div>

    <div id="lastUpdate" class="meta">Menunggu data sensor</div>
  </div>

  <script>
    const MAX_POINTS = 60; // Simpan 60 titik data (~1 menit)
    let peakRpm = 0;

    // Inisialisasi Grafik Chart.js
    const ctx = document.getElementById('rpmChart').getContext('2d');
    const rpmChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'RPM',
          data: [],
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.15)',
          borderWidth: 2.5,
          pointRadius: 2,
          pointHoverRadius: 5,
          pointBackgroundColor: '#38bdf8',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false, // Matikan animasi agar update tiap 1 detik mulus
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1e293b',
            titleColor: '#94a3b8',
            bodyColor: '#38bdf8',
            borderColor: '#334155',
            borderWidth: 1,
            displayColors: false,
            callbacks: {
              label: (context) => `${context.parsed.y} RPM`
            }
          }
        },
        scales: {
          x: {
            grid: { color: 'rgba(51, 65, 85, 0.4)' },
            ticks: { color: '#64748b', maxTicksLimit: 8, font: { size: 11 } }
          },
          y: {
            beginAtZero: true,
            grid: { color: 'rgba(51, 65, 85, 0.4)' },
            ticks: { color: '#94a3b8', font: { size: 11 } }
          }
        }
      }
    });

    function resetChart() {
      rpmChart.data.labels = [];
      rpmChart.data.datasets[0].data = [];
      rpmChart.update();
      peakRpm = 0;
      document.getElementById('peakRpm').textContent = '0';
    }

    async function fetchRPM() {
      try {
        const res = await fetch('/api/rpm');
        const data = await res.json();

        const currentRpm = data.rpm || 0;
        document.getElementById('rpm').textContent = currentRpm;

        // Update nilai puncak (Peak RPM)
        if (currentRpm > peakRpm) {
          peakRpm = currentRpm;
          document.getElementById('peakRpm').textContent = peakRpm;
        }

        // Update indikator status
        const dot = document.getElementById('dot');
        const statusText = document.getElementById('statusText');
        if (data.online) {
          dot.classList.add('online');
          statusText.textContent = currentRpm > 0 ? 'ESP32 Online • Berputar' : 'ESP32 Online • Diam';
        } else {
          dot.classList.remove('online');
          statusText.textContent = 'ESP32 Offline';
        }

        // Tambahkan titik baru ke grafik
        const nowLabel = new Date().toLocaleTimeString('id-ID', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });

        rpmChart.data.labels.push(nowLabel);
        rpmChart.data.datasets[0].data.push(currentRpm);

        if (rpmChart.data.labels.length > MAX_POINTS) {
          rpmChart.data.labels.shift();
          rpmChart.data.datasets[0].data.shift();
        }
        rpmChart.update();

        if (data.updatedAt) {
          const waktu = new Date(data.updatedAt).toLocaleTimeString('id-ID');
          document.getElementById('lastUpdate').textContent = `Update terakhir: ${waktu}`;
        }
      } catch (err) {
        document.getElementById('statusText').textContent = 'Gagal memuat API';
      }
    }

    fetchRPM();
    setInterval(fetchRPM, 1000);
  </script>
</body>
</html>
